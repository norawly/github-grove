name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check public source for private files and credentials
        run: python3 scripts/privacy-check.py
      - name: Check calendar, parser, streak and cache
        run: bash scripts/test.sh
      - name: Build universal application and installers
        run: bash scripts/build.sh --package
      - name: Render the real native view without opening windows
        run: |
          dist/Grove.app/Contents/MacOS/Grove --render build/preview-dark.png --theme dark
          dist/Grove.app/Contents/MacOS/Grove --render build/preview-light.png --theme light
      - uses: actions/upload-artifact@v4
        with:
          name: Grove-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
            build/preview-*.png
